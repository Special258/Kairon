<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="planeGrad512" x1="50" y1="50" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow512" x="50" y="80" width="412" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad512)"/>
  <rect width="512" height="256" rx="120" fill="rgba(255,255,255,0.1)"/>
  <rect x="2" y="2" width="508" height="508" rx="118" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- Iconic 3-Layer Prism Glyph -->
  <g filter="url(#shadow512)">
    <!-- Top Layer -->
    <path d="M256 118 L96 198 L256 278 L416 198 Z" fill="url(#planeGrad512)"/>
    <!-- Middle Layer -->
    <path d="M96 268 L256 348 L416 268" stroke="url(#planeGrad512)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Layer -->
    <path d="M96 338 L256 418 L416 338" stroke="url(#planeGrad512)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
