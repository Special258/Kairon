<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="20" y1="20" x2="172" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="20" y="30" width="152" height="132" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="192" height="192" rx="46" fill="url(#bgGrad)"/>
  <rect width="192" height="96" rx="46" fill="rgba(255,255,255,0.12)"/>
  <rect x="1" y="1" width="190" height="190" rx="45" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Iconic 3-Layer Prism Glyph -->
  <g filter="url(#shadow)">
    <!-- Top Layer -->
    <path d="M96 44 L36 74 L96 104 L156 74 Z" fill="url(#planeGrad)"/>
    <!-- Middle Layer -->
    <path d="M36 100 L96 130 L156 100" stroke="url(#planeGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Layer -->
    <path d="M36 126 L96 156 L156 126" stroke="url(#planeGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
